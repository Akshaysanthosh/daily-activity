name: Daily automated activity

on:
  schedule:
    # 09:47, 17:47, and 21:47 IST. Later runs are no-ops after success.
    - cron: '17 4,12,16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Kolkata
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Record today's automated activity
        run: python3 scripts/update_activity.py

      - name: Commit and push if today's entry is new
        env:
          GIT_AUTHOR_NAME: Ash Pillai
          GIT_AUTHOR_EMAIL: 16001487+Akshaysanthosh@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          git add -- activity.log
          if git diff --cached --quiet; then
            echo "Today's activity is already recorded."
            exit 0
          fi
          git commit -m "chore: automated daily activity $(date +%F)"
          git push origin HEAD:main
